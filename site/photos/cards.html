<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Table Cards · Stephanie &amp; Robert</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=EB+Garamond:wght@400;500&family=Jost:wght@300;400&family=Pinyon+Script&display=swap">
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/base.css">
  <style>
    body { background: #e9ece9; }
    .controls {
      max-width: 760px; margin: 24px auto; padding: 20px 24px; background: #fff; border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
    }
    .controls h1 { font-size: 2rem; margin: 0 0 6px; }
    .controls p { margin: 0 0 14px; color: var(--color-text-muted); font-size: 0.95rem; }
    .controls__row { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; }
    .controls label { display: flex; align-items: center; gap: 10px; font-size: 0.95rem; }
    .controls input[type="number"] { width: 90px; }
    .controls .warning { color: var(--color-error); background: #fbeaea; border-radius: var(--radius-sm); padding: 10px 14px; }
    .sheets { display: grid; justify-content: center; gap: 24px; padding: 0 16px 60px; }
    .sheet { width: 10in; height: 7in; display: flex; background: #fff; box-shadow: var(--shadow-sm); transform-origin: top center; }
    @media (max-width: 1040px) { .sheet { zoom: 0.5; } }

    .card {
      position: relative; width: 5in; height: 7in; overflow: hidden; background: #fff;
      outline: 1px dashed #d4d4d4; outline-offset: -0.5px; text-align: center; color: #2e2e2e;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 0.85in 0.55in 0.75in;
    }
    .card::before, .card::after { content: ''; position: absolute; pointer-events: none; border-color: #333; border-style: solid; }
    .card::before { top: 0.3in; left: 0.3in; width: 1.8in; height: 4.2in; border-width: 1.2px 0 0 1.2px; }
    .card::after { bottom: 0.25in; right: 0.3in; width: 1.8in; height: 4.2in; border-width: 0 1.2px 1.2px 0; }
    .card__floral { position: absolute; pointer-events: none; }
    .card__floral--top { top: 0; right: 0; width: 2in; }
    .card__floral--bottom { bottom: 0; left: 0; width: 1.7in; }
    .card > *:not(.card__floral) { position: relative; z-index: 1; }
    .card__table { font-family: 'EB Garamond', var(--font-serif); text-transform: uppercase; letter-spacing: 0.32em; font-size: 13pt; color: var(--pink-600); margin: 0 0 2pt; }
    .card__title { font-family: var(--font-script); font-weight: 400; font-size: 40pt; line-height: 1.05; color: var(--green-900); margin: 0 0 6pt; }
    .card__text { font-family: var(--font-serif); font-size: 13.5pt; line-height: 1.35; margin: 0 0 12pt; max-width: 3.4in; }
    .card__qr { width: 2.15in; height: 2.15in; padding: 0.06in; background: #fff; }
    .card__qr svg { width: 100%; height: 100%; display: block; }
    .card__how { font-family: var(--font-sans); font-size: 8.5pt; letter-spacing: 0.18em; text-transform: uppercase; margin: 10pt 0 0; color: #555; }
    .card__fallback { font-family: var(--font-sans); font-size: 7.5pt; margin: 4pt 0 0; color: #777; letter-spacing: 0.04em; }
    .card__monogram { font-family: var(--font-serif); font-style: italic; font-size: 16pt; margin: 12pt 0 0; color: var(--green-900); }

    @page { size: letter landscape; margin: 0.5in 0.5in; }
    @media print {
      body { background: #fff; }
      .controls { display: none; }
      .sheets { display: block; padding: 0; }
      .sheet { box-shadow: none; zoom: 1; break-after: page; page-break-after: always; }
      .sheet:last-child { break-after: auto; page-break-after: auto; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div class="controls">
    <h1>Table cards</h1>
    <p>Each card's QR code opens the photo album, so guests can share photos and see everyone's. Two 5×7 cards print on each letter-size page (landscape), with light dashed lines to cut along.</p>
    <p class="warning" id="warning" hidden></p>
    <div class="controls__row">
      <label>Number of tables <input class="input" type="number" id="tables" min="1" max="80" value="12"></label>
      <label><input type="checkbox" id="numbered" checked> Put the table number on each card</label>
      <button class="btn" type="button" id="print">Print</button>
    </div>
  </div>
  <div class="sheets" id="sheets"></div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/qrcode.js"></script>
  <script src="../js/photo-tools.js"></script>
  <script src="../js/cards.js"></script>
</body>
</html>
